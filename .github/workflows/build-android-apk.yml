name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Shiftly Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install NPM Dependencies
        run: npm install

      - name: 5. Build Web App
        run: npm run build

      - name: 6. Sync Capacitor Android
        run: npx cap sync android

      - name: 7. Make gradlew executable
        run: chmod +x android/gradlew

      - name: 8. Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: 9. Upload APK on Success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 10. Upload Debug Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-failure-log
          path: gradle-build.log
          retention-days: 7
