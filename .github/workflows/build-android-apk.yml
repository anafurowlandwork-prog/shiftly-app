name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Shiftly Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Build APK
        run: |
          (
            set -e
            npm install
            npm run build
            npx cap sync android
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          ) 2>&1 | tee runner.log

      - name: 5. Upload APK on Success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 6. Save Log to Diagnostic Branch
        if: always()
        run: |
          git config --global user.name "Shiftly CI"
          git config --global user.email "ci@shiftly.app"
          git checkout -B ci-logs
          git add -f runner.log
          git commit -m "ci: capture runner execution log [skip ci]" || true
          git push -f origin ci-logs || true
