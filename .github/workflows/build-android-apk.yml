name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Shiftly Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Execute Full Build & Compile APK
        run: |
          set -e
          echo "=== 1. Installing NPM Dependencies ==="
          npm install
          echo "=== 2. Building Production Web App ==="
          npm run build
          echo "=== 3. Synchronizing Capacitor Android ==="
          npx cap sync android
          echo "=== 4. Compiling Android APK with Gradle ==="
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK on Success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
