<svg width="700" height="520" viewBox="0 0 700 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Electric Blue Background -->
  <rect width="700" height="520" rx="32" fill="#0052ff"/>

  <defs>
    <!-- Crisp 3D extrusion shadow -->
    <filter id="lemfi3d-arrow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
      <feDropShadow dx="10" dy="10" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
      <feDropShadow dx="14" dy="14" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
      <feDropShadow dx="16" dy="16" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
      <feDropShadow dx="18" dy="18" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>

  <g transform="translate(60, 60)">
    <!-- TOP ROW: SHiFT -->
    <g transform="translate(0, 0)">
      <!-- S (Stepped block bevels) -->
      <path d="M 0 32 L 32 0 L 96 0 L 96 38 L 38 38 L 38 60 L 90 68 L 96 122 L 64 154 L 0 154 L 0 116 L 58 116 L 58 96 L 6 86 Z" fill="#ffffff" filter="url(#lemfi3d-arrow)"/>
      
      <!-- H -->
      <path d="M 116 0 L 154 0 L 154 54 L 182 54 L 182 0 L 220 0 L 220 154 L 182 154 L 182 92 L 154 92 L 154 154 L 116 154 Z" fill="#ffffff" filter="url(#lemfi3d-arrow)"/>
      
      <!-- i (Stepped pedestal like LemFi) -->
      <path d="M 252 0 L 284 0 L 284 30 L 252 30 Z M 240 46 L 296 46 L 296 72 L 280 72 L 280 126 L 302 126 L 302 154 L 234 154 L 234 126 L 256 126 L 256 72 L 240 72 Z" fill="#ffffff" filter="url(#lemfi3d-arrow)"/>
      
      <!-- F -->
      <path d="M 324 0 L 420 0 L 420 38 L 362 38 L 362 60 L 406 60 L 406 94 L 362 94 L 362 154 L 324 154 Z" fill="#ffffff" filter="url(#lemfi3d-arrow)"/>
      
      <!-- T -->
      <path d="M 438 0 L 534 0 L 534 38 L 505 38 L 505 154 L 467 154 L 467 38 L 438 38 Z" fill="#ffffff" filter="url(#lemfi3d-arrow)"/>
    </g>

    <!-- BOTTOM ROW: ly WITH INTEGRATED SPEED ARROW & MOTION DASH CUTOUTS -->
    <g transform="translate(180, 200)">
      <!-- l (Matching Fi positioning) -->
      <path d="M 0 0 L 38 0 L 38 116 L 90 116 L 90 154 L 0 154 Z" fill="#ffffff" filter="url(#lemfi3d-arrow)"/>

      <!-- y with Right-Pointing Speed Arrow & Motion Dashes -->
      <!-- The right arm of the y transitions directly into the speed arrow shaft and arrowhead -->
      <g filter="url(#lemfi3d-arrow)">
        <!-- Combined Y + Speed Arrow Path -->
        <path d="M 112 0 
                 L 152 0 
                 L 176 58 
                 L 200 0 
                 L 240 0 
                 L 202 88 
                 L 202 116
                 L 310 116
                 L 300 88
                 L 380 135
                 L 300 182
                 L 310 154
                 L 164 154 
                 L 164 88 Z" 
              fill="#ffffff" 
              fill-rule="evenodd"
        />

        <!-- Motion Dash Cutouts on the arrow shaft (Matching the user's reference image: 1 dot + 1 long dash) -->
        <rect x="222" y="130" width="14" height="10" rx="5" fill="#0052ff"/>
        <rect x="246" y="130" width="46" height="10" rx="5" fill="#0052ff"/>
      </g>
    </g>
  </g>
</svg>
